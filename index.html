<!DOCTYPE html>
<html lang="ka">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0,user-scalable=no">

        <title>BMI კალკულატორი</title>
        <link rel="stylesheet" href="styles.css"></link>
        <link rel="manifest" href="manifest.json">
    </head>
    <body>
        
        <div class="container">
            <h1>BMI კალკულატორი</h1>
            <input type="number" id="height" placeholder="შეიყვანეთ სიმაღლე(სმ)">
            <input type="number" id="weight" placeholder="შეიყვანეთ წონა(კგ)">
            <select id="gender" class="gender-select">
             <option value="" disabled selected>სქესი</option>
             <option value="male">კაცი</option>
             <option value="female>ქალი</option>
            </select>
            <button onclick="calculateBMI()">გამოთვლა</button>
            <button onclick="resetCalculator()" class="reset-btn">გასუფთავება</button>
            <p id="result"></p>
        </div>
        <script src="main.js"></script>
    </body>
</html>
